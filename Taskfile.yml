version: "3"

# Component Taskfile for the aws-execution-engine repo. Mirrors what the
# Woodpecker pipeline runs: build the Dockerfile.test image (which lints with
# ruff and copies the contract-drift inputs) and run the unit suite.

tasks:
  test:
    desc: Build the Dockerfile.test image and run the unit tests.
    cmds:
      - docker build -f docker/Dockerfile.test -t aws-execution-engine-test:latest .
      - docker run --rm aws-execution-engine-test:latest

  test:integration:
    desc: >-
      Run the integration suite (mocked AWS SDK) in the same Dockerfile.test
      harness, overriding the unit-only default CMD.
    cmds:
      - docker build -f docker/Dockerfile.test -t aws-execution-engine-test:latest .
      - docker run --rm aws-execution-engine-test:latest tests/integration/ -v

  check:tf:
    desc: Terraform formatting check for the infra trees (no init, no apply).
    cmds:
      - tofu fmt -recursive -check infra/

  check:tf:validate:
    desc: >-
      Terraform validation for the infra trees. Backendless init (no state,
      no apply) then tofu validate per tree.
    cmds:
      - tofu -chdir=infra/00-bootstrap init -backend=false -input=false > /dev/null
      - tofu -chdir=infra/00-bootstrap validate
      - tofu -chdir=infra/01-ecr init -backend=false -input=false > /dev/null
      - tofu -chdir=infra/01-ecr validate
      - tofu -chdir=infra/02-deploy init -backend=false -input=false > /dev/null
      - tofu -chdir=infra/02-deploy validate

  ecr:apply:
    desc: Create/update the tenant ECR repository (infra/01-ecr).
    cmds:
      - tofu -chdir=infra/01-ecr init
      - tofu -chdir=infra/01-ecr apply -auto-approve

  ecr:recover-destroy:
    desc: >-
      TEMPORARY one-time recovery (R2-01), remove after use: import the
      hand-made tenant ECR repo into fresh infra/01-ecr state and destroy it,
      then prove it is gone. Requires tenant creds env, e.g.
      `source ~/project/repos/hamburger/exclude_folder/aws/gear+dev101@thytruth.com/exports.env`
      with region ap-northeast-1. Run by the lead during the clean-tenant
      window only.
    cmds:
      # force_delete = true must be on the resource before destroy: the repo
      # holds images and a plain destroy fails RepositoryNotEmptyException.
      - grep -q 'force_delete = true' infra/01-ecr/main.tf
      - tofu -chdir=infra/01-ecr init
      - tofu -chdir=infra/01-ecr import aws_ecr_repository.this aws-execution-engine
      # Apply the imported config (picks up force_delete) then destroy.
      - tofu -chdir=infra/01-ecr apply -auto-approve
      - tofu -chdir=infra/01-ecr destroy -auto-approve
      # Assert the repository is truly gone (must fail with
      # RepositoryNotFoundException specifically, not e.g. a creds error).
      - |
        out=$(aws ecr describe-repositories --repository-names aws-execution-engine 2>&1) \
          && { echo "ERROR: aws-execution-engine repository still exists" >&2; exit 1; }
        echo "$out" | grep -q RepositoryNotFoundException \
          || { echo "ERROR: describe-repositories failed for another reason: $out" >&2; exit 1; }
        echo "OK: aws-execution-engine repository is absent"

  ecr:mirror:
    desc: >-
      Mirror the public GHCR image into the tenant ECR repo (infra/01-ecr
      must already be applied). Pass an optional tag after `--`; defaults to
      the current checkout's short SHA.
    cmds:
      - bash scripts/mirror-image.sh {{.CLI_ARGS}}
