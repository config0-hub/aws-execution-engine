[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws_exe_sys"
version = "0.1.0"
description = "A generic AWS-native event-driven command execution system."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["boto3>=1.34.0"]

[tool.setuptools.packages.find]
include = ["aws_exe_sys*"]
exclude = ["tests*", "docs*", "infra*", "docker*", "scripts*", "results*"]
